name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tree and tag
        run: scripts/check-release.sh --release "$GITHUB_REF_NAME"
      - name: Exercise installer lifecycle
        run: >-
          python3 -m unittest -v
          tests.test_installer.AsrInstallerTests
          tests.test_installer.InstallerLifecycleTests
      - name: Scan Git history for secrets
        run: scripts/scan-secrets.sh
      - name: Build exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
          FRIDAY_RELEASE_REPOSITORY: ${{ github.repository }}
        run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" dist/*
