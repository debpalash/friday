name: Feature request
description: Propose a focused product or platform change
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What fails or takes too much work today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not an implementation slogan.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Affected boundary
      options:
        - Interface
        - Speech
        - Model runtime
        - Memory and state
        - Desktop or process actions
        - Browser or network
        - Installer and release
        - Documentation
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Privacy, security, and compatibility impact
      description: List new data, permissions, downloads, network access, or platform assumptions.
    validations:
      required: true
